version: "3.8"

services:
  dbdb-primary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbdb-primary
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - primary_storage:/data
    command: ["/data/primary.db", "--host", "0.0.0.0", "--port", "8888", "--role", "primary"]

  dbdb-replica-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbdb-replica-1
    restart: unless-stopped
    depends_on:
      - dbdb-primary
    ports:
      - "8889:8889"
    volumes:
      - replica1_storage:/data
    command: [
      "/data/replica1.db",
      "--host", "0.0.0.0",
      "--port", "8889",
      "--role", "replica",
      "--master-host", "dbdb-primary",
      "--master-port", "8888"
    ]

  dbdb-replica-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbdb-replica-2
    restart: unless-stopped
    depends_on:
      - dbdb-primary
    ports:
      - "8890:8890"
    volumes:
      - replica2_storage:/data
    command: [
      "/data/replica2.db",
      "--host", "0.0.0.0",
      "--port", "8890",
      "--role", "replica",
      "--master-host", "dbdb-primary",
      "--master-port", "8888"
    ]

volumes:
  primary_storage:
    name: dbdb_primary_volume
  replica1_storage:
    name: dbdb_replica1_volume
  replica2_storage:
    name: dbdb_replica2_volume